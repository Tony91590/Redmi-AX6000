
name: Xiaomi-AX3000T-build

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

env:
  REPO_URL: https://github.com/hanwckf/immortalwrt-mt798x
  REPO_BRANCH: openwrt-21.02
  REPO_COMMIT: ''
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: Xiaomi-AX3000T/.config
  DIY_P1_SH: Xiaomi-AX3000T/diy-part1.sh
  DIY_P2_SH: Xiaomi-AX3000T/diy-part2.sh
  UPLOAD_FIRMWARE: 'true'
  UPLOAD_RELEASE: 'true'
  UPLOAD_PACKAGES: 'true'
  TZ: Europe/Paris

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ubuntu:20.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5


      - name: Initialiser le conteneur Ubuntu 20.04
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e

          ln -sf /usr/share/zoneinfo/$TZ /etc/localtime
          echo "$TZ" > /etc/timezone

          apt-get update -y
          apt-get full-upgrade -y

          apt-get install -y --no-install-recommends \
            ack \
            antlr3 \
            asciidoc \
            autoconf \
            automake \
            autopoint \
            binutils \
            bison \
            build-essential \
            bzip2 \
            ccache \
            clang \
            clangd \
            cmake \
            cpio \
            curl \
            device-tree-compiler \
            ecj \
            fastjar \
            flex \
            gawk \
            gettext \
            gcc-multilib \
            g++-multilib \
            git \
            gperf \
            haveged \
            help2man \
            intltool \
            lib32gcc-s1 \
            libc6-dev-i386 \
            libelf-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libltdl-dev \
            libmpc-dev \
            libmpfr-dev \
            libncurses5-dev \
            libncursesw5 \
            libncursesw5-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            lld \
            lldb \
            lrzsz \
            mkisofs \
            msmtp \
            nano \
            ninja-build \
            p7zip \
            p7zip-full \
            patch \
            pkgconf \
            python2.7 \
            python3 \
            python3-pip \
            python3-ply \
            python3-docutils \
            qemu-utils \
            re2c \
            rsync \
            scons \
            squashfs-tools \
            subversion \
            swig \
            texinfo \
            uglifyjs \
            upx-ucl \
            unzip \
            vim \
            wget \
            xmlto \
            xxd \
            zlib1g-dev \
            ca-certificates \
            file \
            g++ \
            gawk \
            perl \
            python3-setuptools \
            python3-yaml \
            time \
            xsltproc \
            zstd

          mkdir -p /workdir
          chmod 777 /workdir

          echo "===== Ubuntu ====="
          cat /etc/os-release

          echo "===== CPU ====="
          nproc

          echo "===== Disk ====="
          df -hT

      - name: Télécharger les sources
        working-directory: /workdir
        run: |
          set -e

          git clone "$REPO_URL" \
            -b "$REPO_BRANCH" openwrt

          cd openwrt

          if [ -n "$REPO_COMMIT" ]; then
            git checkout "$REPO_COMMIT"
          fi

          ln -sfn /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

      - name: Charger feeds.conf.default et DIY P1
        run: |
          set -e

          if [ -f "$FEEDS_CONF" ]; then
            cp "$FEEDS_CONF" openwrt/feeds.conf.default
          fi

          chmod +x "$DIY_P1_SH"

          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P1_SH"

      - name: Mettre à jour et installer les feeds
        run: |
          set -e

          cd openwrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Charger la configuration et DIY P2
        run: |
          set -e

          if [ -f "$CONFIG_FILE" ]; then
            cp "$CONFIG_FILE" openwrt/.config
          fi

          chmod +x "$DIY_P2_SH"

          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P2_SH"

      - name: Préparer la configuration
        run: |
          set -e

          cd openwrt

          make defconfig

          echo "===== Configuration cible ====="
          grep '^CONFIG_TARGET' .config || true

      - name: Télécharger les sources nécessaires
        run: |
          set -e

          cd openwrt

          make download -j"$(nproc)"

          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compiler OpenWrt
        id: compile
        run: |
          set -e

          cd openwrt

          echo "Compilation avec $(nproc) threads"

          make -j"$(nproc)" || make -j1 || make -j1 V=s

          grep '^CONFIG_TARGET.*DEVICE.*=y' .config \
            | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME

          if [ -s DEVICE_NAME ]; then
            echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
          else
            echo "Impossible de déterminer DEVICE_NAME"
            exit 1
          fi

          grep '^CONFIG_TARGET.*DEVICE.*=y' .config \
            | sed -r 's/.*TARGET_.*_(.*)_DEVICE_.*=y/\1/' > TARGET_NAME

          if [ -s TARGET_NAME ]; then
            echo "TARGET_NAME=$(cat TARGET_NAME)" >> "$GITHUB_ENV"
          fi

          echo "FILE_DATE=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Vérifier l'espace disque
        if: always()
        run: df -hT

      - name: Envoyer les paquets
        uses: actions/upload-artifact@v6
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_PACKAGES == 'true'
        with:
          name: OpenWrt_packages-${{ env.FILE_DATE }}
          path: openwrt/bin/packages/
          if-no-files-found: warn

      - name: Préparer les firmwares
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          set -e

          TARGET_DIR="$(find openwrt/bin/targets -mindepth 2 -maxdepth 2 -type d | head -n 1)"

          if [ -z "$TARGET_DIR" ]; then
            echo "Aucun répertoire firmware trouvé"
            exit 1
          fi

          rm -rf "$TARGET_DIR/packages"

          echo "FIRMWARE=$GITHUB_WORKSPACE/$TARGET_DIR" >> "$GITHUB_ENV"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Envoyer les firmwares
        uses: actions/upload-artifact@v6
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_firmware-${{ env.DEVICE_NAME }}-${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}/
          if-no-files-found: error

      - name: Générer la release
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
        run: |
          set -e

          echo "release_tag=${FILE_DATE}-Xiaomi-AX3000T" >> "$GITHUB_OUTPUT"

          cat > release.txt << 'EOF'
          Firmware OpenWrt / ImmortalWrt compilé avec GitHub Actions.

          Appareil : Xiaomi AX3000T
          Adresse par défaut : 192.168.1.1

          Vérifiez la compatibilité du firmware avec votre appareil
          et sa méthode d'installation avant de flasher.
          EOF

          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Publier la release GitHub
        uses: softprops/action-gh-release@v3
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: ${{ env.FIRMWARE }}/*
